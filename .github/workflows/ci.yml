name: Django CI

on: [push, pull_request]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install flake8
        run: |
          python -m pip install --upgrade pip
          pip install flake8

      - name: Run Flake8
        run: flake8 .

  test:
    runs-on: ubuntu-latest
    needs: lint

    services:
      postgres:
        image: postgres:14
        env:
          POSTGRES_DB: ${{ secrets.POSTGRES_DB }}
          POSTGRES_USER: ${{ secrets.POSTGRES_USER }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - name: Check out code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Wait for PostgreSQL
        run: |
          sudo apt-get install -y postgresql-client
          timeout 30s bash -c 'until pg_isready -h localhost -p 5432; do sleep 1; done;'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -v -r requirements.txt

      - name: Run tests
        run: python manage.py test
        env:
          SECRET_KEY: ${{ secrets.DJANGO_SECRET_KEY }}
          DEBUG: "True"
          POSTGRES_DB: ${{ secrets.POSTGRES_DB }}
          POSTGRES_USER: ${{ secrets.POSTGRES_USER }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          POSTGRES_HOST: ${{ secrets.POSTGRES_HOST }}
          POSTGRES_PORT: ${{ secrets.POSTGRES_PORT }}

  build:
    needs: test
    runs-on: ubuntu-latest

    steps:
      - name: Check out code
        uses: actions/checkout@v3

      - name: Log in to Docker Hub
        run: echo ${{ secrets.DOCKER_HUB_ACCESS_TOKEN }} | docker login -u ${{ secrets.DOCKER_HUB_USERNAME }} --password-stdin

      - name: Build Docker image
        run: docker build -t ${{ secrets.DOCKER_HUB_USERNAME }}/homework_drf:${{ github.sha }} .

      - name: Push Docker image to Docker Hub
        run: docker push ${{ secrets.DOCKER_HUB_USERNAME }}/homework_drf:${{ github.sha }}

  deploy:
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Check out code
        uses: actions/checkout@v3

      - name: Set up SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Copy project files (FIXED)
        run: |
          rsync -avz --no-o --no-g --exclude='.git/' --exclude='static/' \
            -e "ssh -o StrictHostKeyChecking=no" \
            . \
            ${{ secrets.SSH_USER }}@${{ secrets.SERVER_IP }}:${{ secrets.DEPLOY_PATH }}

      - name: Create .env file on server
        run: |
          ssh -o StrictHostKeyChecking=no ${{ secrets.SSH_USER }}@${{ secrets.SERVER_IP }} "
            cat > ${{ secrets.DEPLOY_PATH }}/.env << 'EOF'
          POSTGRES_DB=${{ secrets.POSTGRES_DB }}
          POSTGRES_USER=${{ secrets.POSTGRES_USER }}
          POSTGRES_PASSWORD=${{ secrets.POSTGRES_PASSWORD }}
          POSTGRES_HOST=${{ secrets.POSTGRES_HOST }}
          POSTGRES_PORT=${{ secrets.POSTGRES_PORT }}
          SECRET_KEY=${{ secrets.DJANGO_SECRET_KEY }}
          DEBUG=0
          EOF
            chmod 644 ${{ secrets.DEPLOY_PATH }}/.env
            echo 'File created successfully'
          "

      - name: Check port 8000
        run: |
          ssh -o StrictHostKeyChecking=no ${{ secrets.SSH_USER }}@${{ secrets.SERVER_IP }} "
            echo '=== Processes on port 8000 ==='
            sudo lsof -i :8000 || echo 'No processes found'
            echo '=== Network connections on port 8000 ==='
            sudo netstat -tlnp | grep :8000 || echo 'No connections found'
            echo '=== Docker processes ==='
            docker ps -a | grep :8000 || echo 'No docker containers on port 8000'
          "

      - name: Deploy to server
        run: |
          ssh -o StrictHostKeyChecking=no ${{ secrets.SSH_USER }}@${{ secrets.SERVER_IP }} "
            echo '=== BEFORE CLEANUP ==='
            docker ps -a --filter 'name=www-'
            docker network ls | grep www || true
            docker volume ls | grep www || true

            echo '=== CLEANING UP ==='
            echo 'Using deploy path: ${{ secrets.DEPLOY_PATH }}'
            cd ${{ secrets.DEPLOY_PATH }}

            docker compose down --rmi all --volumes --remove-orphans
            docker network rm www_default 2>/dev/null || true

            echo '=== FREEING PORTS 80 AND 8000 ==='
            for port in 80 8000; do
              echo \"Clearing port \$port\"
              sudo lsof -ti:\$port | xargs sudo kill -9 2>/dev/null || true
              sudo fuser -k \$port/tcp 2>/dev/null || true
              sudo pkill -9 -f \":\$port\" || true
            done

            echo '=== AFTER CLEANUP ==='  
            docker ps -a --filter 'name=www-'
            docker network ls | grep www || true

            echo '=== STARTING ==='
            for port in 80 8000; do
              if sudo lsof -i :\$port; then
                echo \"PORT \$port IS STILL IN USE! FORCE KILLING...\"
                sudo pkill -9 -f \":\$port\" || true
                sudo fuser -k \$port/tcp || true
              fi
            done

            docker compose up -d db redis

            echo 'Waiting for database to start...'                
            sleep 30
            docker compose up -d --build
          "